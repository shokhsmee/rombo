# Inside the frontend container. A host proxy (TLS) in front forwards everything here.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    client_max_body_size 30m;  # drawings are up to 25 MB (DATA_UPLOAD_MAX_MEMORY_SIZE = 30 MB)
    root /usr/share/nginx/html;

    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # Django admin / DRF docs assets (collectstatic into the shared volume)
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Telegram Mini Apps for the Servis bots (separate Vite entry, miniapp.html)
    location /app/ {
        try_files $uri /miniapp.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
